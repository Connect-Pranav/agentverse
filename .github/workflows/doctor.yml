name: Code Doctor scan

# Syntax, module links, tests, workflow YAML, committed secrets, live API and a real browser check of the
# deployed dashboard at 1920 / 1440 / 390 px. Results go to the dashboard's Code Doctor (+).
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'   # 06:00 IST daily
  workflow_dispatch:
    inputs:
      shots:
        description: 'Print screenshots into the log'
        type: boolean
        default: false

concurrency:
  group: doctor
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser for the live UI check
        run: |
          npm install --no-save --no-package-lock --silent playwright@1.49
          npx playwright install --with-deps chromium > /dev/null
      - name: Wait for the new version to deploy
        if: github.event_name == 'push'
        run: sleep 150
      - name: Scan
        run: node scripts/doctor-scan.mjs
        env:
          DOCTOR_PRINT_SHOTS: ${{ inputs.shots && '1' || '' }}
          # presence only (true/false); secret values are never passed to the scan
          HAS_SV_MCP_TOKEN: ${{ secrets.SV_MCP_TOKEN != '' }}
          HAS_MCP_TOKEN: ${{ secrets.MCP_TOKEN != '' }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID != '' }}
          HAS_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET != '' }}
          HAS_YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN != '' }}
          HAS_GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN != '' }}
          HAS_LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN != '' }}
          HAS_LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN != '' }}
          HAS_REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID != '' }}
          HAS_REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET != '' }}
          HAS_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          HAS_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID != '' }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-doctor
          path: |
            doctor-report.json
            doctor-*.jpg
          if-no-files-found: ignore
          retention-days: 14
