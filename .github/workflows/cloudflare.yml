name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["AGENTVERSE lead scraper", "AGENTVERSE 24/7 agents"]
    types: [completed]
  workflow_dispatch: {}
concurrency: cloudflare
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: tok
        run: echo "has=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.tok.outputs.has == 'true'
        with: { ref: main }
      - name: Deploy AGENTVERSE (dashboard + MCP)
        if: steps.tok.outputs.has == 'true'
        run: |
          npx -y wrangler@4 deploy
          if [ -n "$SV_MCP_TOKEN" ]; then printf '%s' "$SV_MCP_TOKEN" | npx -y wrangler@4 secret put MCP_TOKEN; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SV_MCP_TOKEN: ${{ secrets.SV_MCP_TOKEN }}
      - name: No token yet
        if: steps.tok.outputs.has != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets to auto-deploy (dashboard + sunverse-mcp)."
