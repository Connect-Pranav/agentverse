name: PRANAV SIGNAL — LinkedIn Growth Studio

on:
  schedule:
    # 09:30 IST on LinkedIn slot days (Wed, Fri) so the post can be approved before its 4:00 / 3:30 PM slot
    - cron: '0 4 * * 3,5'
  workflow_dispatch:

concurrency:
  group: signal-runner
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run PRANAV SIGNAL Orchestrator Pipeline
        env:
          SV_MCP_URL: ${{ vars.SV_MCP_URL }}
          SV_MCP_TOKEN: ${{ secrets.SV_MCP_TOKEN || secrets.MCP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: |
          node scripts/signal-runner.mjs

      - name: Animated GIF of today's visual
        if: success()
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          npm install --no-save --no-package-lock --silent @resvg/resvg-js@2
          node scripts/signal-gif.mjs
        env:
          SIGNAL_OUT: signal-out
      - name: Keep the files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-motion
          path: signal-out/
          if-no-files-found: ignore
          retention-days: 7
