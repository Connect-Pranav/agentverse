name: SUNVERSE song → video (MCP renderer)

# Picks up songs uploaded in AGENTVERSE (MCP tile / Claude connector) and makes the video.
# No repo secrets needed: the runner signs in to the AGENTVERSE Worker with GitHub's OIDC token.
#   free (default): faster-whisper lyrics + AGENTVERSE cloud brain + Cloudflare FLUX images → no approval needed
#   GEMINI_API_KEY secret set: Gemini (free tier) listens and makes the images; when its free quota runs out the
#   rest falls back to free Cloudflare images. Only repo variable GEMINI_BILLING=on treats Gemini as paid (approval).
# YouTube posting needs YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN.
# The Worker starts this instantly when it has GH_DISPATCH_TOKEN; otherwise GitHub's schedule (can lag).

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: songvideo
  cancel-in-progress: false

env:
  SV_MCP_URL: ${{ vars.SV_MCP_URL }}
  SV_MCP_TOKEN: ${{ secrets.SV_MCP_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Anything to do?
        id: cfg
        run: |
          python3 - <<'PY'
          import importlib.util, os
          s = importlib.util.spec_from_file_location("r", "scripts/songvideo-runner.py"); r = importlib.util.module_from_spec(s); s.loader.exec_module(r)
          try:
              n = r.ganesha("GET", "/api/songvideo/runner/pending").get("pending", 0)
          except Exception as e:
              print("::error title=AGENTVERSE runner sign-in::" + " ".join(r.redact(e).split())[:500])
              raise
          print(f"{n} song job(s) waiting")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"pending={n}\n")
          PY
      - name: Install ffmpeg, fonts, Pillow
        if: steps.cfg.outputs.pending != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core fonts-inter >/dev/null || sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core >/dev/null
          python3 -m pip install --quiet pillow
      - name: Install free speech-to-text
        if: steps.cfg.outputs.pending != '0'
        run: python3 -m pip install --quiet faster-whisper indic_transliteration
      - uses: actions/cache@v4
        if: steps.cfg.outputs.pending != '0'
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Process song jobs
        if: steps.cfg.outputs.pending != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          SONGVIDEO_IMAGE_ENGINE: ${{ vars.SONGVIDEO_IMAGE_ENGINE }}
          SONGVIDEO_IMAGE_USD: ${{ vars.SONGVIDEO_IMAGE_USD }}
          GEMINI_BILLING: ${{ vars.GEMINI_BILLING }}
          SONGVIDEO_CAPTIONS: ${{ vars.SONGVIDEO_CAPTIONS }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 scripts/songvideo-runner.py
      - name: More songs waiting? Run again right away
        if: always() && steps.cfg.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python3 - <<'PY'
          import importlib.util
          s = importlib.util.spec_from_file_location("r", "scripts/songvideo-runner.py"); r = importlib.util.module_from_spec(s); s.loader.exec_module(r)
          try:
              print(r.ganesha("GET", "/api/songvideo/runner/pending").get("pending", 0))
          except Exception:
              print(0)
          PY
          )
          echo "$n job(s) still waiting"
          if [ "$n" != "0" ]; then gh workflow run songvideo.yml --ref main -R "$GITHUB_REPOSITORY"; fi
